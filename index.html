<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Desconto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { padding: 8px; font-size: 16px; }
        .resultado { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px; }
    </style>
</head>
<body>

    <h2>Calculadora de Descontos</h2>

    <div class="campo">
        <label for="valorCompra">Valor da Compra (R$):</label>
        <input type="number" id="valorCompra" step="0.01" placeholder="Ex: 150.00">
        <button onclick="calcularDesconto()">Calcular</button>
    </div>

    <div class="resultado" id="resultado" style="display: none;">
        <p><strong>Valor da compra:</strong> R$ <span id="resCompra"></span></p>
        <p><strong>Valor do desconto:</strong> R$ <span id="resDesconto"></span></p>
        <p><strong>Valor da compra com desconto:</strong> R$ <span id="resFinal"></span></p>
    </div>

    <script>
        function calcularDesconto() {
            
            const valorCompra = parseFloat(document.getElementById('valorCompra').value);

            
            if (isNaN(valorCompra) || valorCompra < 0) {
                alert("Por favor, digite um valor de compra válido.");
                return;
            }

            let percentualDesconto = 0.00;

            
            if (valorCompra > 500) {
                percentualDesconto = 0.10; 
            } else if (valorCompra > 100) {
                percentualDesconto = 0.05; 
            }

            
            const valorDesconto = valorCompra * percentualDesconto;
            const valorFinal = valorCompra - valorDesconto;

           
            document.getElementById('resCompra').innerText = valorCompra.toFixed(2);
            document.getElementById('resDesconto').innerText = valorDesconto.toFixed(2);
            document.getElementById('resFinal').innerText = valorFinal.toFixed(2);
        
            document.getElementById('resultado').style.display = 'block';
        }
    </script>

</body>
</html>
